syntax = "proto3";

package raft;

option go_package = "github.com/nickemma/meridian/proto/raft";

// ---- Core Data Types -----

// A single entry in the Raft log
// Every state change in Meridian is represented as a LogEntry
// This is committed through consensus before it takes effect.

message LogEntry {
  uint64 index   = 1; // position in the log — never changes once written
  uint64 term    = 2; // which leader term this entry was created in
  bytes  command = 3; // the actual operation (serialized) — opaque to Raft itself
}

// --- RequestVote RPC ---
// A candidate sends this to every other node when an election starts.
// The receiver decides whether this candidate deserves its vote.

message RequestVoteRequest {
  uint64 term           = 1; // candidate's current term
  string candidate_id   = 2; // who is asking for the vote
  uint64 last_log_index = 3; // index of candidate's last log entry
  uint64 last_log_term  = 4; // term of candidate's last log entry
}

message RequestVoteResponse {
  uint64 term         = 1; // receiver's current term (so candidate can update itself)
  bool   vote_granted = 2; // did the receiver grant the vote?
}

// --- AppendEntries RPC ---
// The leader sends this to all followers constantly.
// When entries is empty, it's a heartbeat — just proving the leader is alive.
// When entries is non-empty, it's replicating new log entries.

message AppendEntriesRequest {
  uint64            term           = 1; // leader's current term
  string            leader_id      = 2; // so followers can redirect clients
  uint64            prev_log_index = 3; // index of log entry immediately before new ones
  uint64            prev_log_term  = 4; // term of prev_log_index entry
  repeated LogEntry entries        = 5; // log entries to store (empty for heartbeat)
  uint64            leader_commit  = 6; // leader's commit index
}

message AppendEntriesResponse {
  uint64 term    = 1; // follower's current term (so leader can update itself)
  bool   success = 2; // true if follower matched prev_log_index and prev_log_term
  uint64 match_index = 3; // highest log index the follower has replicated (for leader tracking)
}

// --- The Raft RPC Service ---

service RaftService {
  // Candidates call this on other nodes during an election
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Leaders call this on followers — for replication and heartbeats
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
