# External references used by the evaluation harness. They are deliberately
# separate from Meridian's development cluster so no result can accidentally
# mix state or network settings across systems.
services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
    ports: ["23791:2379"]
    volumes: ["etcd-1:/etcd-data"]
    networks: ["baselines"]
  etcd-2:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
    ports: ["23792:2379"]
    volumes: ["etcd-2:/etcd-data"]
    networks: ["baselines"]
  etcd-3:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
    ports: ["23793:2379"]
    volumes: ["etcd-3:/etcd-data"]
    networks: ["baselines"]
  cassandra-1:
    image: cassandra:4.1.8
    environment:
      CASSANDRA_CLUSTER_NAME: MeridianBaseline
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports: ["9042:9042"]
    volumes: ["cassandra-1:/var/lib/cassandra"]
    networks: ["baselines"]

networks:
  baselines: {}
volumes:
  etcd-1: {}
  etcd-2: {}
  etcd-3: {}
  cassandra-1: {}
