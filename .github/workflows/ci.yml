name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Generate protobuf
        run: make proto

      - name: Build
        run: make build

      - name: Test
        run: make test

  build-storage-engine:
    name: Build Storage Engine (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87"
          components: rustfmt, clippy

      - name: Build
        working-directory: storage-engine
        run: cargo build

      - name: Test
        working-directory: storage-engine
        run: cargo test

      - name: Lint
        working-directory: storage-engine
        run: cargo clippy -- -D warnings

  storage-ffi-integration:
    name: Storage FFI Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87"

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Generate protobuf
        run: make proto

      - name: Test Go to Rust storage boundary
        run: |
          make test-storage-ffi
          make test-strong-integration

      - name: Reproduce secure storage fault trial
        run: |
          make build-storageffi build-tools
          mkdir -p results
          bin/meridian-lab -out results/ci-storage-trial

      - name: Retain sanitized storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-fault-evidence
          path: |
            results/ci-storage-trial/summary.json
            results/ci-storage-trial/environment.json
            results/ci-storage-trial/timeline.jsonl
            results/ci-storage-trial/*.log
            results/ci-storage-trial/*-metrics.txt
          if-no-files-found: warn
